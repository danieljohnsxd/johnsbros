<!doctype html>
<html lang="en">
  <head>
    <!-- @include head -->
    <title>Contact · JohnsBros</title>
    <meta name="description" content="Schedule a consultation or ask JohnsBros a question about your commercial, residential or civil project." />
  </head>
  <body>
    <!-- @include header -->

    <main id="main" class="bg-stone-50">
      <div class="container-x grid gap-12 py-16 md:py-24 lg:grid-cols-[2fr_3fr] lg:gap-20">
        <section>
          <p class="eyebrow">Contact us</p>
          <h1 class="mt-3 text-4xl font-semibold md:text-5xl">Let’s talk about your project</h1>
          <p class="mt-5 text-lg leading-relaxed text-stone-600">Schedule a consultation or send us a question. We’ll get back to you soon.</p>
          <dl class="mt-10 space-y-6 text-lg">
            <div>
              <dt class="text-base font-medium text-stone-500">Phone</dt>
              <dd><a href="tel:+17135539444" class="font-semibold text-stone-950 hover:text-copper-600">713 553 9444</a></dd>
            </div>
            <div>
              <dt class="text-base font-medium text-stone-500">Email</dt>
              <dd><a href="mailto:info@johnsbros.com" class="font-semibold text-stone-950 hover:text-copper-600">info@johnsbros.com</a></dd>
            </div>
            <div>
              <dt class="text-base font-medium text-stone-500">Mailing address</dt>
              <dd class="text-stone-950">PO Box 16206<br />Houston, TX 77222</dd>
            </div>
          </dl>
        </section>

        <section aria-labelledby="form-heading" class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm sm:p-10">
          <h2 id="form-heading" class="text-2xl font-semibold">Schedule a consultation</h2>
          <p class="mt-2 text-base text-stone-600">Fields marked * are required.</p>
          <form data-contact class="mt-8 grid gap-6 sm:grid-cols-2">
            <input name="company" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden" />
            <label class="text-base font-medium text-stone-800">First name *<input name="first" required autocomplete="given-name" class="field" /></label>
            <label class="text-base font-medium text-stone-800">Last name *<input name="last" required autocomplete="family-name" class="field" /></label>
            <label class="text-base font-medium text-stone-800">Email *<input name="email" type="email" required autocomplete="email" class="field" /></label>
            <label class="text-base font-medium text-stone-800">Phone *<input name="phone" type="tel" required autocomplete="tel" class="field" /></label>
            <label class="text-base font-medium text-stone-800 sm:col-span-2">Tell us about your project<textarea name="message" rows="5" class="field resize-y"></textarea></label>
            <div class="flex flex-wrap items-center gap-5 sm:col-span-2">
              <button class="btn-primary disabled:opacity-60">Send message</button>
              <p data-status role="status" class="text-base text-stone-700"></p>
            </div>
          </form>
        </section>
      </div>
    </main>

    <!-- @include footer -->
  </body>
</html>
