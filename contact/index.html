<!doctype html>
<html lang="en">
  <head>
    <!-- @include head -->
    <title>Contact · JohnsBros</title>
    <meta name="description" content="Schedule a consultation or ask JohnsBros a question about your commercial, residential or civil project." />
  </head>
  <body>
    <!-- @include header -->

    <main id="main">
      <section class="blueprint bg-chrome-900 pt-20 text-white">
        <div class="container-x py-20 md:py-28">
          <p class="eyebrow text-copper-300">Contact</p>
          <h1 class="display mt-6 text-[clamp(1.75rem,8.5vw,2.5rem)] md:text-[clamp(2.25rem,min(6.5vw,10svh),6.25rem)] text-white">Let’s talk<br /><span class="text-copper-400">about it.</span></h1>
        </div>
      </section>

      <div class="container-x grid gap-16 py-20 md:py-28 lg:grid-cols-[1fr_2fr] lg:gap-24">
        <section aria-label="Contact details">
          <p class="text-xl leading-relaxed text-stone-600">Schedule a consultation or send us a question, and we’ll get back to you soon.</p>
          <dl class="mt-12 divide-y divide-stone-950/15 border-y border-stone-950/15">
            <div class="py-6">
              <dt class="font-display text-sm font-semibold tracking-[0.18em] text-copper-600 uppercase">Phone</dt>
              <dd class="mt-2"><a href="tel:+17135539444" class="display-sm text-3xl hover:text-copper-600">713 553 9444</a></dd>
            </div>
            <div class="py-6">
              <dt class="font-display text-sm font-semibold tracking-[0.18em] text-copper-600 uppercase">Email</dt>
              <dd class="mt-2"><a href="mailto:info@johnsbros.com" class="display-sm text-2xl break-all hover:text-copper-600">info@johnsbros.com</a></dd>
            </div>
            <div class="py-6">
              <dt class="font-display text-sm font-semibold tracking-[0.18em] text-copper-600 uppercase">Mail</dt>
              <dd class="mt-2 text-xl text-stone-950">PO Box 16206<br />Houston, TX 77222</dd>
            </div>
          </dl>
        </section>

        <section aria-labelledby="form-heading">
          <h2 id="form-heading" class="display-sm text-3xl md:text-4xl">Schedule a consultation</h2>
          <p class="mt-3 text-lg text-stone-600">Fields marked * are required.</p>
          <form data-contact class="mt-10 grid gap-x-10 gap-y-8 sm:grid-cols-2">
            <input name="company" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden" />
            <label class="text-base font-semibold text-stone-800">First name *<input name="first" required autocomplete="given-name" class="field" /></label>
            <label class="text-base font-semibold text-stone-800">Last name *<input name="last" required autocomplete="family-name" class="field" /></label>
            <label class="text-base font-semibold text-stone-800">Email *<input name="email" type="email" required autocomplete="email" class="field" /></label>
            <label class="text-base font-semibold text-stone-800">Phone *<input name="phone" type="tel" required autocomplete="tel" class="field" /></label>
            <label class="text-base font-semibold text-stone-800 sm:col-span-2">Tell us about your project<textarea name="message" rows="4" class="field resize-y"></textarea></label>
            <div class="flex flex-wrap items-center gap-6 sm:col-span-2">
              <button class="btn-primary disabled:opacity-60">Send message <span aria-hidden="true">→</span></button>
              <p data-status role="status" class="text-lg text-stone-700"></p>
            </div>
          </form>
        </section>
      </div>
    </main>

    <!-- @include footer -->
  </body>
</html>
